[package]
name = "rivet-ac3"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-ac3"
homepage = "https://github.com/safewords/rivet-ac3"
documentation = "https://docs.rs/rivet-ac3"
authors = ["Ely Erin Fox"]
description = "An AC-3 / E-AC-3 (Dolby Digital / Digital Plus) decoder and encoder in Rust, written from ATSC A/52:2018: no C, no system libraries, no build script. Decodes AC-3 in full and E-AC-3 independent substream 0 with spectral extension and AHT; encodes AC-3 at 32-640 kbit/s and E-AC-3 at 32-6144 kbit/s, every layout with or without LFE, 7.1 by a dependent substream. rivet's AC-3 codec. Imported as `ac3`."
keywords = ["ac3", "eac3", "dolby", "decoder", "encoder"]
categories = ["multimedia::audio", "multimedia::encoding"]
exclude = [".github/"]

[lib]
name = "ac3"

[dependencies]
thiserror = "2"
# Off by default. With it the decoder logs through `tracing`: the syntax
# trace at TRACE, resynchronisation at DEBUG, skipped damaged frames at WARN.
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[features]
default = []
tracing = ["dep:tracing"]
